---
- name: Start requested service
  become: true
  ansible.builtin.systemd:
    name: "{{ start_stop_service_name }}"
    state: started
  register: start_stop_start_result

- name: Wait for service to reach running state
  become: true
  ansible.builtin.command:
    cmd: "systemctl is-active {{ start_stop_service_name }}"
  register: start_stop_start_validation
  changed_when: false
  failed_when: false
  retries: "{{ start_stop_retry_count }}"
  delay: "{{ start_stop_retry_delay }}"
  until:
    - start_stop_start_validation.stdout == "active"

- name: Verify requested service is running
  ansible.builtin.assert:
    that:
      - start_stop_start_validation.stdout == "active"
    fail_msg: >-
      Service {{ start_stop_service_name }}
      did not reach the expected running state
      after {{ start_stop_retry_count }} attempts.