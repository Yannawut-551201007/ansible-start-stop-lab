---
- name: Stop requested service
  become: true
  ansible.builtin.systemd:
    name: "{{ start_stop_service_name }}"
    state: stopped
  register: start_stop_stop_result

- name: Refresh service facts after Stop
  ansible.builtin.service_facts:

- name: Verify requested service is stopped
  ansible.builtin.assert:
    that:
      - ansible_facts.services[start_stop_service_name].state in ["stopped", "inactive"]
    fail_msg: >-
      Service {{ start_stop_service_name }}
      did not reach the expected stopped state.
