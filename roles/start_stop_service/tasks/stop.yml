---
- name: Stop requested service
  become: true
  ansible.builtin.systemd:
    name: "{{ start_stop_service_name }}"
    state: stopped
  register: start_stop_stop_result

- name: Wait for service to reach stopped state
  become: true
  ansible.builtin.command:
    cmd: "systemctl is-active {{ start_stop_service_name }}"
  register: start_stop_stop_validation
  changed_when: false
  failed_when: false
  retries: "{{ start_stop_retry_count }}"
  delay: "{{ start_stop_retry_delay }}"
  until:
    - start_stop_stop_validation.stdout in ["inactive", "failed", "unknown"]

- name: Verify requested service is stopped
  ansible.builtin.assert:
    that:
      - start_stop_stop_validation.stdout in ["inactive", "failed", "unknown"]
    fail_msg: >-
      Service {{ start_stop_service_name }}
      did not reach the expected stopped state
      after {{ start_stop_retry_count }} attempts.